body{margin:0;background:var(--bg);color:var(--ink);

header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:720px;margin:0 auto;padding:10px 18px;display:flex;gap:10px;align-items:center;
 justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:700;color:var(--acc);font-size:15px}
#langbar{display:flex;gap:6px;flex-wrap:wrap}
.lang{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;
 padding:5px 12px;font-size:13px;cursor:pointer}
.lang.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
#track{height:4px;background:var(--line)}
#bar{height:4px;width:0;background:var(--acc);transition:width .3s}
main{max-width:720px;margin:0 auto;padding:26px 18px 90px}
h1{font-size:26px;line-height:1.25;color:var(--acc);margin:0 0 16px}
h2{font-size:21px;line-height:1.3;color:var(--acc);margin:4px 0 22px;
 padding-bottom:10px;border-bottom:2px solid var(--line)}
.step{color:var(--mut);font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
p.intro{margin:0 0 14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.qt{margin:0 0 4px;font-weight:600;font-size:17px;line-height:1.4}
.num{display:inline-block;min-width:26px;color:var(--acc)}
.hint{margin:2px 0 10px;color:var(--mut);font-size:14px;font-style:italic}
.err{display:none;margin:6px 0 8px;color:var(--err);font-size:14px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:8px;cursor:pointer;
 border:1px solid transparent}
.opt:hover{background:#f2f6fa}
.opt.sel{background:#eaf1f8;border-color:#bcd3e8}
.opt input{margin:3px 0 0;flex:0 0 auto;width:18px;height:18px;accent-color:var(--acc)}
.opt span{flex:1}
.mrow{margin-top:14px}
.mlab{margin:0;font-weight:600;font-size:15px}
input.num-in{width:120px;font-size:17px;padding:9px 11px;border:1px solid var(--line);border-radius:8px}
input.txt,textarea.txt{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);
 border-radius:8px;font-family:inherit}
.unit{color:var(--mut);font-size:14px;margin-left:8px}
.flab{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.nav button{font:inherit;font-size:16px;padding:13px 26px;border-radius:8px;cursor:pointer;
 border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nav button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.nav button:disabled{opacity:.6;cursor:default}
@media(max-width:560px){main{padding:18px 12px 80px}.q{padding:14px}h1{font-size:22px}

#warn{background:#fdecea;border-bottom:2px solid var(--err);color:#7a1500;

#pend{background:#fff6e0;border-bottom:1px solid #e8c977;color:#6b4b00;

a.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;

a.btn:hover{filter:brightness(1.1)}

button.nav-btn{font:inherit;font-size:16px;padding:13px 26px;border-radius:8px;cursor:pointer;

  "PAP": "opshonal"
 },
 "minutes": {
  "ES": "minutos",
  "NL": "minuten",
  "EN": "minutes",
  "PAP": "minüt"
 },
 "chars": {
  "ES": "caracteres",
  "NL": "tekens",
  "EN": "characters",
  "PAP": "karakter"
 },
 "cTitle": {
  "ES": "Manténgase informado",
  "NL": "Blijf op de hoogte",
  "EN": "Stay informed",
  "PAP": "Keda informá"
 },
 "cIntro": {
  "ES": "Usted indicó que desea que le informemos sobre el transporte público en Bonaire. Déjenos aquí sus datos.",
  "NL": "U hebt aangegeven op de hoogte te willen blijven van het openbaar vervoer op Bonaire. Laat hier uw gegevens achter.",
  "EN": "You indicated that you would like to be kept informed about public transport in Bonaire. Leave your details here.",
  "PAP": "Bo a indiká ku bo ke keda informá tokante transporte públiko na Boneiru. Laga bo datonan akinan."
 },
 "cSep": {
  "ES": "Estos datos se guardan por separado y no quedan unidos a las respuestas que acaba de dar.",
  "NL": "Deze gegevens worden apart bewaard en worden niet gekoppeld aan de antwoorden die u zojuist hebt gegeven.",
  "EN": "These details are stored separately and are not linked to the answers you have just given.",
  "PAP": "E datonan aki ta wòrdu wardá aparte i no ta keda uní na e kontestanan ku bo kaba di duna."
 },
 "cNeed": {
  "ES": "Rellene al menos el correo o el teléfono.",
  "NL": "Vul ten minste het e-mailadres of het telefoonnummer in.",
  "EN": "Fill in at least the email address or the telephone number.",
  "PAP": "Yena por lo ménos e e-mail òf e number di telefòn."
 },
 "cSend": {
  "ES": "Enviar mis datos",
  "NL": "Mijn gegevens versturen",
  "EN": "Send my details",
  "PAP": "Manda mi datonan"
 },
 "cDone": {
  "ES": "Gracias. Le mantendremos informado.",
  "NL": "Dank u wel. We houden u op de hoogte.",
  "EN": "Thank you. We will keep you informed.",
  "PAP": "Danki. Nos lo tene bo informá."
 }
};
</script>
<script>
/* ============================================================
   Encuesta de Movilidad y Transporte Público — Bonaire 2026
   MOB-BON-2026 v1.3 · formulario web de 4 idiomas
   ============================================================ */

const LANGS = SURVEY.langs;
let lang = localStorage.getItem('mobbon_lang') || 'ES';
let step = 0;                       // 0 = portada, 1..n = bloques, n+1 = final
const A = JSON.parse(localStorage.getItem('mobbon_ans') || '{}');
let ended = null;

const $ = s => document.querySelector(s);
const t = (k, vars) => {
  let s = UI[k][lang] || UI[k].ES;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replace('{' + a + '}', b);
  return s;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => localStorage.setItem('mobbon_ans', JSON.stringify(A));

/* ---------- derivación de B5a a partir de B2_Motivo ---------- */
const B2_TO_C = {Estudio:'C2', Salud:'C3', Compras:'C4', Gobierno:'C6'};
const B2_NO_CASCADE = ['Familia', 'Iglesia', 'Recreacion', 'Acompanar'];
function b5aCode() {
  const m = A.B2_Motivo;
  if (!m) return null;
  if (B2_TO_C[m]) return B2_TO_C[m];
  if (B2_NO_CASCADE.includes(m)) return null;
  return A.B5a_TipoDestino || null;      // Trabajo u Otro: se pregunta
}

/* ---------- ¿se muestra esta pregunta? ---------- */
function visible(q) {
  if (q.id === 'B5a_TipoDestino')
    return A.B1_ViajaFuera === 'Si' && ['Trabajo', 'Otro'].includes(A.B2_Motivo);
  if (q.id === 'B5b_DestinoEspecifico')
    return A.B1_ViajaFuera === 'Si' && !!b5aCode();
  if (q.id === 'A10_IdiomaMas')
    return (A.A9_Idiomas || []).length > 1;
  const c = q.cond;
  if (!c) return true;
  const v = A[c.q];
  if (v === undefined || v === '') return false;
  if (c.op === '=')  return v === c.v;
  if (c.op === 'in') return c.v.includes(v);
  if (c.op === '>')  return Number(v) > c.v;
  return true;
}

/* ---------- opciones efectivas ---------- */
function optionsOf(q) {
  if (q.id === 'B5b_DestinoEspecifico') return SURVEY.b5b[b5aCode()] || [];
  if (q.id === 'A10_IdiomaMas') {
    const picked = A.A9_Idiomas || [];
    const a9 = allQuestions().find(x => x.id === 'A9_Idiomas');
    return a9.options.filter(o => picked.includes(o.code));
  }
  return q.options || [];
}
const allQuestions = () => SURVEY.blocks.flatMap(b => b.questions);

/* ---------- render ---------- */
function render() {
  document.documentElement.lang = lang.toLowerCase();
  $('#langbar').innerHTML = LANGS.map(l =>
    `<button class="lang${l === lang ? ' on' : ''}" data-l="${l}">${esc(UI.langName[l])}</button>`).join('');

  if (ended) return renderEnd();
  if (step === 0) return renderCover();
  if (step > SURVEY.blocks.length) return renderThanks();
  renderBlock(SURVEY.blocks[step - 1]);
}

function renderCover() {
  $('#bar').style.width = '0%';
  $('#main').innerHTML =
    `<h1>${esc(SURVEY.intro[0][lang])}</h1>` +
    SURVEY.intro.slice(1).map(p =>
      `<p class="intro">${esc(p[lang]).replace(/\n/g, '<br>')}</p>`).join('') +
    `<div class="nav"><button id="go" class="primary">${esc(t('start'))}</button></div>`;
  $('#go').onclick = () => { step = 1; window.scrollTo(0, 0); render(); };
}

function renderBlock(b) {
  const n = SURVEY.blocks.length;
  $('#bar').style.width = (step / (n + 1) * 100) + '%';
  const qs = b.questions.filter(visible);
  let h = `<p class="step">${esc(t('step', {a: step, b: n}))}</p>
           <h2>${esc(b.title[lang])}</h2>`;
  qs.forEach((q, i) => { h += field(q, i + 1); });
  h += `<div class="nav">
          ${step > 1 ? `<button id="prev">${esc(t('back'))}</button>` : '<span></span>'}
          <button id="nx" class="primary">${step === n ? esc(t('submit')) : esc(t('next'))}</button>
        </div>`;
  $('#main').innerHTML = h;
  wire(qs);
}

function field(q, i) {
  const id = q.id;
  const lbl = `<div class="q" id="w_${id}">
     <p class="qt"><span class="num">${i}</span>${esc(q.text[lang])}</p>
     ${q.hint ? `<p class="hint">${esc(q.hint[lang])}</p>` : ''}
     <p class="err" id="e_${id}"></p>`;
  let body = '';
  const opts = optionsOf(q);

  if (q.type === 'radio') {
    const cur = A[id] !== undefined ? A[id] : (q.default ? A[q.default] : undefined);
    body = `<div class="opts">` + opts.map(o =>
      `<label class="opt${cur === o.code ? ' sel' : ''}">
         <input type="radio" name="${id}" value="${esc(o.code)}"${cur === o.code ? ' checked' : ''}>
         <span>${esc(o.label[lang])}</span></label>`).join('') + `</div>`;
  } else if (q.type === 'cascade') {
    body = `<div class="opts">` + opts.map(o =>
      `<label class="opt${A[id] === o.code ? ' sel' : ''}">
         <input type="radio" name="${id}" value="${esc(o.code)}"${A[id] === o.code ? ' checked' : ''}>
         <span>${esc(o.label[lang])}</span></label>`).join('') + `</div>`;
  } else if (q.type === 'check') {
    const cur = A[id] || [];
    body = `<div class="opts">` + opts.map(o =>
      `<label class="opt${cur.includes(o.code) ? ' sel' : ''}">
         <input type="checkbox" name="${id}" value="${esc(o.code)}"${cur.includes(o.code) ? ' checked' : ''}>
         <span>${esc(o.label[lang])}</span></label>`).join('') + `</div>`;
  } else if (q.type === 'number') {
    const unit = id === 'B10_Duracion' ? ` <span class="unit">${esc(t('minutes'))}</span>` : '';
    body = `<p><input class="num-in" type="number" inputmode="numeric" name="${id}"
              min="${q.min}" max="${q.max}" value="${A[id] !== undefined ? esc(A[id]) : ''}">${unit}
            <span class="unit">(${q.min}–${q.max})</span></p>`;
  } else if (q.type === 'text') {
    body = `<p><input class="txt" type="text" name="${id}" maxlength="${q.maxlen}"
              value="${A[id] ? esc(A[id]) : ''}"></p>`;
  } else if (q.type === 'textarea') {
    body = `<p><textarea class="txt" name="${id}" rows="4" maxlength="${q.maxlen}">${A[id] ? esc(A[id]) : ''}</textarea></p>`;
  } else if (q.type === 'matrix') {
    body = q.rows.map((r, ri) => {
      const key = id + '_' + ri;
      return `<div class="mrow"><p class="mlab">${esc(r[lang])}</p><div class="opts">` +
        opts.map(o => `<label class="opt${A[key] === o.code ? ' sel' : ''}">
          <input type="radio" name="${key}" value="${esc(o.code)}"${A[key] === o.code ? ' checked' : ''}>
          <span>${esc(o.label[lang])}</span></label>`).join('') + `</div></div>`;
    }).join('');
  }
  return lbl + body + `</div>`;
}

/* ---------- eventos ---------- */
function wire(qs) {
  $('#main').querySelectorAll('input,textarea').forEach(el => {
    el.addEventListener('change', () => {
      const nm = el.name;
      if (el.type === 'checkbox') {
        const q = allQuestions().find(x => x.id === nm);
        let cur = A[nm] || [];
        if (el.checked) {
          if (q.exclusive && el.value === q.exclusive) cur = [el.value];
          else { cur = cur.filter(v => v !== q.exclusive); cur.push(el.value); }
        } else cur = cur.filter(v => v !== el.value);
        if (q.maxSelect && cur.length > q.maxSelect) {
          el.checked = false;
          return flash(nm, t('maxSel', {n: q.maxSelect}));
        }
        A[nm] = cur;
      } else A[nm] = el.value;
      save();
      if (['B2_Motivo','B5a_TipoDestino','A9_Idiomas','A4_Autos','B1_ViajaFuera',
           'B13_ViajeNoRealizado','A3_MenoresEscolarizados','F2_ConsentContacto'].includes(nm)) {
        const y = window.scrollY; render(); window.scrollTo(0, y);
      } else {
        el.closest('.opts')?.querySelectorAll('.opt').forEach(o =>
          o.classList.toggle('sel', o.querySelector('input').checked));
      }
    });
  });
  $('#prev') && ($('#prev').onclick = () => { step--; window.scrollTo(0, 0); render(); });
  $('#nx').onclick = () => {
    if (!validate(qs)) return;
    if (A.Consent === 'No')       return end(t('outConsent'));
    if (A.Residencia === 'No')    return end(t('outResid'));
    if (A.Edad && Number(A.Edad) < 16) return end(t('outEdad'));
    if (step === SURVEY.blocks.length) return submit();
    step++; window.scrollTo(0, 0); render();

  };
}

function flash(id, msg) {
  const e = $('#e_' + id) || $('#e_' + id.split('_').slice(0, -1).join('_'));
  if (!e) return alert(msg);
  e.textContent = msg; e.style.display = 'block';
  e.closest('.q').scrollIntoView({behavior: 'smooth', block: 'center'});
}

function validate(qs) {
  $('#main').querySelectorAll('.err').forEach(e => { e.textContent = ''; e.style.display = 'none'; });
  for (const q of qs) {
    const v = A[q.id];
    if (q.type === 'matrix') {
      for (let ri = 0; ri < q.rows.length; ri++)
        if (!A[q.id + '_' + ri]) { flash(q.id, t('required')); return false; }
      continue;
    }
    if (q.type === 'number' && v !== undefined && v !== '') {
      const n = Number(v);
      if (!Number.isInteger(n) || n < q.min || n > q.max) {
        flash(q.id, t('range', {a: q.min, b: q.max})); return false;
      }
    }
    if (q.required && (v === undefined || v === '' || (Array.isArray(v) && !v.length))) {
      flash(q.id, t('required')); return false;
    }
    if (q.lte && A[q.lte] !== undefined && Number(v) > Number(A[q.lte])) {
      flash(q.id, t('errA3')); return false;
    }
    if (q.neq && v && v === A[q.neq]) { flash(q.id, t('errB4')); return false; }
  }
  return true;
}

/* ---------- envío: cola persistente con reintento ---------- */
const QK = 'mobbon_queue';
const queue = () => { try { return JSON.parse(localStorage.getItem(QK) || '[]'); } catch (e) { return []; } };
const setQueue = q => { try { localStorage.setItem(QK, JSON.stringify(q)); } catch (e) {} };

/** Intenta vaciar la cola. Devuelve cuántos quedan pendientes. */
async function flush() {
  if (!ENDPOINT) return queue().length;
  let q = queue();
  while (q.length) {
    try {
      await fetch(ENDPOINT, {
        method: 'POST', mode: 'no-cors', keepalive: true,
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(q[0])
      });
    } catch (e) {
      break;                       // sin conexión: se queda en la cola para el próximo intento
    }
    q.shift(); setQueue(q); q = queue();
  }
  return q.length;
}

async function submit() {
  const btn = $('#nx'); btn.disabled = true; btn.textContent = t('sending');
  const payload = {
    instrumento: 'MOB-BON-2026 v1.3',
    idioma: lang,
    enviado: new Date().toISOString(),
    canal: new URLSearchParams(location.search).get('canal') || 'CH99',
    respuestas: A
  };
  const q = queue(); q.push(payload); setQueue(q);

  if (!ENDPOINT) {                 // sin destino configurado: descarga local (solo para pruebas)
    const b = new Blob([JSON.stringify(payload, null, 1)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'MOBBON26_' + Date.now() + '.json';
    a.click();
    setQueue([]);
    return done();
  }
  const pend = await flush();
  if (pend === 0) return done();
  btn.disabled = false; btn.textContent = t('submit');
  flash(SURVEY.blocks[step - 1].questions[0].id, t('sendErr'));
}

function done() {
  try { localStorage.setItem('mobbon_contacto', A.F2_ConsentContacto === 'Si' ? '1' : '0'); } catch (e) {}
  localStorage.removeItem('mobbon_ans'); localStorage.removeItem('mobbon_last'); step = SURVEY.blocks.length + 1; window.scrollTo(0, 0); render(); }

function renderThanks() {
  $('#bar').style.width = '100%';
  let h = `<h2>${esc(SURVEY.closing.f1[0][lang])}</h2>
           <p class="intro">${esc(SURVEY.closing.f6[lang])}</p>`;
  if (localStorage.getItem('mobbon_contacto') === '1') {
    // Los datos de contacto se piden AQUI MISMO, sin cambiar de pantalla,
    // pero se envian en una peticion aparte a otro destino (ver enviarContacto).
    h += `<div class="q" id="cbox" style="margin-top:24px">
       <p class="qt">${esc(t('cTitle'))}</p>
       <p class="hint">${esc(t('cIntro'))}</p>
       <p class="err" id="cerr"></p>
       <p><label class="flab">${esc(t('nameL'))}</label>
          <input class="txt" id="c_n" type="text" maxlength="40" autocomplete="name"></p>
       <p><label class="flab">${esc(t('emailL'))}</label>
          <input class="txt" id="c_e" type="email" maxlength="60" autocomplete="email"></p>
       <p><label class="flab">${esc(t('telL'))}</label>
          <input class="txt" id="c_p" type="tel" maxlength="15" autocomplete="tel"></p>
       <p style="margin-top:16px">
          <button id="csend" class="primary nav-btn">${esc(t('cSend'))}</button></p>
       <p class="sep-note">${esc(t('cSep'))}</p>
     </div>`;
  }
  $('#main').innerHTML = h;
  const b = $('#csend');
  if (b) b.onclick = enviarContacto;
}

/** Envio INDEPENDIENTE: otra peticion, otro destino, sin nada que lo ate a las respuestas. */
async function enviarContacto() {
  const n = $('#c_n').value.trim(), e = $('#c_e').value.trim(), p = $('#c_p').value.trim();
  const err = $('#cerr');
  err.style.display = 'none';
  if (!e && !p) { err.textContent = t('cNeed'); err.style.display = 'block'; return; }
  const b = $('#csend'); b.disabled = true; b.textContent = t('sending');
  const payload = {tipo: 'contacto', idioma: lang, nombre: n, email: e, telefono: p};
  try {
    if (ENDPOINT) {
      await fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', keepalive: true,
        headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
    }
    localStorage.removeItem('mobbon_contacto');
    $('#cbox').innerHTML = `<p class="qt">${esc(t('cDone'))}</p>`;
  } catch (x) {
    b.disabled = false; b.textContent = t('cSend');
    err.textContent = t('sendErr'); err.style.display = 'block';
  }
}

function end(msg) { ended = msg; localStorage.removeItem('mobbon_ans'); window.scrollTo(0, 0); render(); }
function renderEnd() {
  $('#bar').style.width = '100%';
  $('#main').innerHTML = `<h2>${esc(ended)}</h2>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('.lang');
  if (!b) return;
  lang = b.dataset.l; localStorage.setItem('mobbon_lang', lang);
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
render();

/* ---------- salvaguardas para quien publica el formulario ---------- */
(function admin() {
  if (!ENDPOINT) {
    const d = document.createElement('div');
    d.id = 'warn';
    d.innerHTML = '<b>CONFIGURACION INCOMPLETA.</b> La linea ENDPOINT de este archivo esta vacia: ' +
      'las respuestas NO se envian a ninguna parte, solo se descargan en el dispositivo de quien ' +
      'responde. Pegue la URL de su Google Apps Script antes de publicar este formulario.';
    document.body.prepend(d);
  }
  flush().then(n => {
    if (n > 0 && ENDPOINT) {
      const d = document.createElement('div');
      d.id = 'pend';
      d.textContent = n + ' respuesta(s) pendiente(s) de enviar. Se reintentara automaticamente.';
      document.body.prepend(d);
    }
  });
  if (location.hash === '#estado') {
    alert('Destino configurado: ' + (ENDPOINT ? 'SI' : 'NO') +
          '\nRespuestas en cola: ' + queue().length);
  }
})();

</script>
