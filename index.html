<style>
:root{--ink:#14202b;--mut:#5a6b7a;--line:#dfe6ec;--acc:#1F4E79;--bg:#f6f8fa;--card:#fff;--err:#a61c00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:720px;margin:0 auto;padding:10px 18px;display:flex;gap:10px;align-items:center;
 justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:700;color:var(--acc);font-size:15px}
#langbar{display:flex;gap:6px;flex-wrap:wrap}
.lang{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;
 padding:5px 12px;font-size:13px;cursor:pointer}
.lang.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
#track{height:4px;background:var(--line)}
#bar{height:4px;width:0;background:var(--acc);transition:width .3s}
main{max-width:720px;margin:0 auto;padding:26px 18px 90px}
h1{font-size:26px;line-height:1.25;color:var(--acc);margin:0 0 16px}
h2{font-size:21px;line-height:1.3;color:var(--acc);margin:4px 0 22px;
 padding-bottom:10px;border-bottom:2px solid var(--line)}
.step{color:var(--mut);font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
p.intro{margin:0 0 14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.qt{margin:0 0 4px;font-weight:600;font-size:17px;line-height:1.4}
.num{display:inline-block;min-width:26px;color:var(--acc)}
.hint{margin:2px 0 10px;color:var(--mut);font-size:14px;font-style:italic}
.err{display:none;margin:6px 0 8px;color:var(--err);font-size:14px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:8px;cursor:pointer;
 border:1px solid transparent}
.opt:hover{background:#f2f6fa}
.opt.sel{background:#eaf1f8;border-color:#bcd3e8}
.opt input{margin:3px 0 0;flex:0 0 auto;width:18px;height:18px;accent-color:var(--acc)}
.opt span{flex:1}
.mrow{margin-top:14px}
.mlab{margin:0;font-weight:600;font-size:15px}
input.num-in{width:120px;font-size:17px;padding:9px 11px;border:1px solid var(--line);border-radius:8px}
input.txt,textarea.txt{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);
 border-radius:8px;font-family:inherit}
.unit{color:var(--mut);font-size:14px;margin-left:8px}
.flab{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.nav button{font:inherit;font-size:16px;padding:13px 26px;border-radius:8px;cursor:pointer;
 border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nav button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.nav button:disabled{opacity:.6;cursor:default}
@media(max-width:560px){main{padding:18px 12px 80px}.q{padding:14px}h1{font-size:22px}
 .nav button{flex:1;padding:14px 12px}}
#warn{background:#fdecea;border-bottom:2px solid var(--err);color:#7a1500;
 padding:11px 18px;font-size:14px;line-height:1.45}
#pend{background:#fff6e0;border-bottom:1px solid #e8c977;color:#6b4b00;
 padding:9px 18px;font-size:13px}
a.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;
 padding:13px 26px;border-radius:8px;font-size:16px}
a.btn:hover{filter:brightness(1.1)}
.sep-note{margin-top:18px;color:var(--mut);font-size:13px;line-height:1.5}
button.nav-btn{font:inherit;font-size:16px;padding:13px 26px;border-radius:8px;cursor:pointer;
 border:1px solid var(--acc);background:var(--acc);color:#fff;font-weight:600}
button.nav-btn:disabled{opacity:.6;cursor:default}
.otro-wrap{margin:6px 0 0 34px}
input.otro{max-width:340px}

/* ---------- v1.5: tarjetas de eleccion del Bloque C ---------- */
.situ{font-weight:700;font-size:1.05rem;margin:18px 0 6px;color:#1F4E79}
.cardwrap{margin:10px 0 18px;border:2px solid #1F4E79;border-radius:10px;overflow:hidden}
table.card3{width:100%;border-collapse:collapse;table-layout:fixed}
table.card3 th,table.card3 td{padding:9px 8px;font-size:.95rem;line-height:1.3;
  border-bottom:1px solid #dfe6ec;text-align:center;vertical-align:middle;word-wrap:break-word}
table.card3 tr:last-child th,table.card3 tr:last-child td{border-bottom:none}
table.card3 tr th:first-child{text-align:left;background:#f1f5f9;font-weight:600;width:30%;color:#14202b}
table.card3 th.alt{background:#1F4E79;color:#fff;font-weight:700;font-size:1rem}
table.card3 th.alt.hoy{background:#5a6b7a}
table.card3 td.hoy{background:#f6f8fa;color:#5a6b7a;font-size:.88rem}
table.card3 td b{font-size:1.1rem;color:#1F4E79}
a.priv{color:#1F4E79;font-weight:600}
#draft{border:2px solid #b8860b;background:#fffdf5}
@media(max-width:480px){
  table.card3 th,table.card3 td{padding:7px 4px;font-size:.82rem}
  table.card3 tr th:first-child{width:27%}
  table.card3 td b{font-size:.98rem}
  table.card3 td.hoy{font-size:.76rem}
}

<script>
const SURVEY = {"langs": ["ES", "NL", "EN", "PAP"], "intro": [{"ES": "Encuesta sobre movilidad y transporte público en Bonaire", "NL": "Enquête over mobiliteit en openbaar vervoer op Bonaire", "EN": "Survey on mobility and public transport in Bonaire", "PAP": "Enkuesta tokante mobilidat i transporte públiko na Boneiru"}, {"ES": "Estimado/a residente,", "NL": "Geachte inwoner,", "EN": "Dear resident,", "PAP": "Estimá residente,"}, {"ES": "El Openbaar Lichaam Bonaire está preparando la puesta en marcha de un servicio de transporte público en la isla. Para diseñar rutas, paradas, horarios y tarifas que realmente sirvan a quienes viven aquí, necesitamos saber cómo se desplaza usted hoy y qué necesitaría para usar el servicio.", "NL": "Het Openbaar Lichaam Bonaire bereidt de invoering van openbaar vervoer op het eiland voor. Om routes, haltes, dienstregelingen en tarieven te ontwerpen die echt van nut zijn voor de mensen die hier wonen, moeten we weten hoe u zich vandaag verplaatst en wat u nodig zou hebben om van de dienst gebruik te maken.", "EN": "The Openbaar Lichaam Bonaire is preparing to launch a public transport service on the island. To design routes, stops, timetables and fares that genuinely serve the people who live here, we need to know how you travel today and what you would need in order to use the service.", "PAP": "Openbaar Lichaam Bonaire ta prepará pa introdusí un servisio di transporte públiko riba e isla. Pa diseñá ruta, parada, orario i tarifa ku di bèrdat ta sirbi e hendenan ku ta biba akinan, nos mester sa kon bo ta move awendia i kiko lo bo tin mester pa usa e servisio."}, {"ES": "Esta encuesta dura aproximadamente 10 minutos. No hay respuestas correctas ni incorrectas.", "NL": "Deze enquête duurt ongeveer 10 minuten. Er zijn geen goede of foute antwoorden.", "EN": "This survey takes about 10 minutes. There are no right or wrong answers.", "PAP": "E enkuesta aki ta dura mas o ménos 10 minüt. No tin kontesta korekto ni inkorekto."}, {"ES": "Sus respuestas se guardan de forma anónima y separada de cualquier dato que permita identificarle. Al final, y solo si usted lo desea, podrá dejar sus datos de contacto en un formulario aparte.", "NL": "Uw antwoorden worden anoniem bewaard en gescheiden van alle gegevens waarmee u geïdentificeerd zou kunnen worden. Aan het einde kunt u, en alleen als u dat zelf wilt, uw contactgegevens achterlaten in een apart formulier.", "EN": "Your answers are stored anonymously and separately from any data that could identify you. At the end, and only if you wish, you may leave your contact details in a separate form.", "PAP": "Bo kontestanan ta wòrdu warda anónimamente i separá for di kualke dato ku por identifiká bo. Na final, i solamente si bo ke, bo por laga bo datonan di kontakto den un formulario aparte."}], "blocks": [{"title": {"ES": "Bloque 0 — Introducción y consentimiento", "NL": "Blok 0 — Inleiding en toestemming", "EN": "Block 0 — Introduction and consent", "PAP": "Blòk 0 — Introdukshon i konsentimentu"}, "questions": [{"id": "Consent", "type": "radio", "text": {"ES": "¿Ha leído la información anterior y acepta participar en esta encuesta?", "NL": "Hebt u de bovenstaande informatie gelezen en stemt u ermee in deel te nemen aan deze enquête?", "EN": "Have you read the information above and do you agree to take part in this survey?", "PAP": "Bo a lesa e informashon ariba i bo ta di akuerdo pa partisipá den e enkuesta aki?"}, "required": true, "options": [{"code": "Si", "label": {"ES": "Sí, acepto participar", "NL": "Ja, ik neem deel", "EN": "Yes, I agree to take part", "PAP": "Sí, mi ta partisipá"}}, {"code": "No", "label": {"ES": "No", "NL": "Nee", "EN": "No", "PAP": "Nò"}}]}, {"id": "Residencia", "type": "radio", "text": {"ES": "¿Vive usted en Bonaire desde hace más de 6 meses?", "NL": "Woont u langer dan 6 maanden op Bonaire?", "EN": "Have you been living in Bonaire for more than 6 months?", "PAP": "Bo ta biba na Boneiru mas ku 6 luna?"}, "options": [{"code": "Si", "labe <script>
/* ============================================================
   Encuesta de Movilidad y Transporte Público — Bonaire 2026
   MOB-BON-2026 v1.5 · formulario web de 4 idiomas
   ============================================================ */

const LANGS = SURVEY.langs;
let lang = localStorage.getItem('mobbon_lang') || 'ES';
let step = 0;                       // 0 = portada, 1..n = bloques, n+1 = final
let sub  = 0;                       // pantalla dentro del bloque (Bloque C)
let ended = null;

/* ---------- borrador: NUNCA se restaura en silencio ----------
   Un formulario publico se responde muchas veces en el mismo telefono o
   tableta. Si las respuestas anteriores reaparecen solas, la segunda persona
   hereda las de la primera. Por eso el borrador solo se ofrece de forma
   explicita, y caduca a las seis horas. */
const VIDA_BORRADOR = 6 * 60 * 60 * 1000;

function leerBorrador() {
  try {
    const raw = localStorage.getItem('mobbon_ans');
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.t || !d.a || !Object.keys(d.a).length) return null;
    if (Date.now() - d.t > VIDA_BORRADOR) { localStorage.removeItem('mobbon_ans'); return null; }
    return d;
  } catch (e) { return null; }
}
const borrador = leerBorrador();
const A = {};
let ofrecerBorrador = !!borrador;

function olvidar() {
  for (const k of Object.keys(A)) delete A[k];
  localStorage.removeItem('mobbon_ans');
  localStorage.removeItem('mobbon_last');
  step = 0; sub = 0; ended = null;
}

const $ = s => document.querySelector(s);
const t = (k, vars) => {
  let s = UI[k][lang] || UI[k].ES;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replace('{' + a + '}', b);
  return s;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => {
  try { localStorage.setItem('mobbon_ans', JSON.stringify({t: Date.now(), s: step, a: A})); }
  catch (e) {}
};

/* ---------- v1.4: la lista de B5b se deriva de B2_Motivo, sin pregunta intermedia ---------- */
const B2_SIN_LISTA = ['Familia', 'Iglesia', 'Recreacion', 'Acompanar', 'Otro'];   // v1.5: «Otro» va directo a B5c
/** Devuelve la sublista de destinos que corresponde al motivo, o null si no hay. */
function listaB5b() {
  const m = A.B2_Motivo;
  if (!m || B2_SIN_LISTA.includes(m)) return null;
  return SURVEY.b5b[m] || null;
}
/** true si en B5b se eligió una opción «Otro» (código terminado en 99). */
const b5bEsOtro = () => /99$/.test(A.B5b_DestinoEspecifico || '');

/* ---------- Bloque C: experimento de eleccion declarada ----------
   A cada persona se le asigna al azar uno de los cuatro bloques del diseno
   D-eficiente. La asignacion se guarda con la respuesta: sin ella no se sabe
   que tarjetas vio y el dato no se puede analizar. */
function bloqueC() {
  if (!A.C_Bloque) {
    A.C_Bloque = 1 + Math.floor(Math.random() * SURVEY.bloqueC.design.length);
    save();
  }
  return SURVEY.bloqueC.design[A.C_Bloque - 1];
}
function tarjeta(n) { return bloqueC()[n - 1]; }

/** Nombre legible de un barrio respondido (o el texto escrito si eligio «Otro»). */
function nombreBarrio(qid) {
  const v = A[qid];
  if (!v) return '';
  if (/99$/.test(v) && A[qid + '_Otro']) return A[qid + '_Otro'];
  const q = allQuestions().find(x => x.id === qid);
  const o = q && q.options.find(x => x.code === v);
  return o ? o.label[lang] : v;
}
/** IntroKeuze del master: el escenario A nombra el viaje real; el B, uno generico. */
function introC() {
  const BC = SURVEY.bloqueC;
  if (escenarioC() === 'ESC_A') {
    const o = A.B3_OrigenEsBarrio === 'No' ? nombreBarrio('B3b_Origen') : nombreBarrio('A1_Barrio');
    return BC.introA[lang].replace('{o}', o).replace('{d}', nombreBarrio('B4_Destino'))
                          .replace('{m}', BC.b10Largo[A.B10_Duracion][lang]);
  }
  return BC.introB[lang].replace('{o}', nombreBarrio('A1_Barrio'));
}

/** Minutos de viaje declarados en B10, base del pivote de las tarjetas. */
function baseC() {
  // solo se pivota sobre B10 en el escenario A; si la persona volvio atras y dijo
  // que no viaja, un B10 viejo que aun quede en memoria no debe usarse
  // B10 se responde por rangos: el pivote usa el punto medio del rango
  return escenarioC() === 'ESC_A' ? SURVEY.bloqueC.b10Medio[A.B10_Duracion] : SURVEY.bloqueC.baseDefault;
}
/** C0_EscenarioTipo del master: ESC_A = pivotado sobre el viaje real de la persona,
    ESC_B = generico, porque no declaro viaje habitual o no supo su duracion.
    No son intercambiables: el B es mas hipotetico y en la estimacion entra aparte. */
function escenarioC() {
  const r = A.B10_Duracion;                 // rango; «No lo sé» (D99) lleva al escenario genérico
  return (A.B1_ViajaFuera === 'Si' && r && SURVEY.bloqueC.b10Medio[r]) ? 'ESC_A' : 'ESC_B';
}

/* ---------- ¿se muestra esta pregunta? ---------- */
function visible(q) {
  if (q.id === 'B5b_DestinoEspecifico')
    return A.B1_ViajaFuera === 'Si' && !!listaB5b();
  if (q.id === 'B5c_DestinoNombre') {
    // v1.5: siempre visible bajo B5b (opcional); obligatoria solo si en B5b se eligió «Otro»
    if (A.B1_ViajaFuera !== 'Si') return false;
    return !!A.B2_Motivo;
  }
  if (q.id === 'A10_IdiomaMas')
    return (A.A9_Idiomas || []).length > 1;
  const c = q.cond;
  if (!c) return true;
  // Visibilidad en cascada: si la pregunta de la que depende esta oculta, esta tambien.
  // Sin esto, B3 = No y luego B1 = No dejaba visible la lista de barrios de B3b.
  const madre = allQuestions().find(x => x.id === c.q);
  if (madre && !visible(madre)) return false;
  const v = A[c.q];
  if (v === undefined || v === '') return false;
  if (c.op === '=')  return v === c.v;
  if (c.op === 'in') return c.v.includes(v);
  if (c.op === '>')  return Number(v) > c.v;
  if (c.op === 'ne')  return v !== c.v;
  if (c.op === 'set') return !(Array.isArray(v) ? !v.length : v === undefined || v === '');
  return true;
}

/* ---------- opciones efectivas ---------- */
function optionsOf(q) {
  if (q.id === 'B5b_DestinoEspecifico') return listaB5b() || [];
  if (q.id === 'A10_IdiomaMas') {
    const picked = A.A9_Idiomas || [];
    const a9 = allQuestions().find(x => x.id === 'A9_Idiomas');
    return a9.options.filter(o => picked.includes(o.code));
  }
  return q.options || [];
}
const allQuestions = () => SURVEY.blocks.flatMap(b => b.questions);

/** ¿está marcada la opción «Otro» de esta pregunta? */
function otroActivo(q) {
  const v = A[q.id];
  if (v === undefined) return false;
  return Array.isArray(v) ? v.includes(q.otherCode) : v === q.otherCode;
}

/* ---------- render ---------- */
function render() {
  document.documentElement.lang = lang.toLowerCase();
  document.body.classList.toggle('portada', step === 0 && !ended);
  $('#langbar').innerHTML = LANGS.map(l =>
    `<button class="lang${l === lang ? ' on' : ''}" data-l="${l}">${esc(UI.langName[l])}</button>`).join('');

  if (ended) return renderEnd();
  if (step === 0) return renderCover();
  if (step > SURVEY.blocks.length) return renderThanks();
  renderBlock(SURVEY.blocks[step - 1]);
}

function renderCover() {
  $('#bar').style.width = '0%';
  const P = SURVEY.privacy;
  let h = `<h1>${esc(SURVEY.intro[0][lang])}</h1>` +
    SURVEY.intro.slice(1).map(p =>
      `<p class="intro">${esc(p[lang]).replace(/\n/g, '<br>')}</p>`).join('');
  if (P) h += `<p class="intro">${esc(P.text[lang])}</p>
               <p class="intro"><a class="priv" href="${esc(P.url)}" target="_blank"
                  rel="noopener">${esc(P.link[lang])}</a></p>`;

  if (ofrecerBorrador) {
    // Se pregunta. Nunca se rellena solo: en un dispositivo compartido las
    // respuestas de la persona anterior contaminarian las de esta.
    h += `<div class="q" id="draft">
            <p class="qt">${esc(t('draftTitle'))}</p>
            <p class="hint">${esc(t('draftIntro'))}</p>
            <div class="nav">
              <button id="dnew">${esc(t('draftNew'))}</button>
              <button id="dgo" class="primary">${esc(t('draftGo'))}</button>
            </div>
          </div>`;
  } else {
    h += `<div class="nav"><button id="go" class="primary">${esc(t('start'))}</button></div>`;
  }
  $('#main').innerHTML = h;
  if (ofrecerBorrador) {
    $('#dgo').onclick = () => {
      Object.assign(A, borrador.a);
      ofrecerBorrador = false;
      step = Math.min(Math.max(1, borrador.s || 1), SURVEY.blocks.length);
      sub = 0; window.scrollTo(0, 0); render();
    };
    $('#dnew').onclick = () => { ofrecerBorrador = false; olvidar(); render(); };
  } else {
    $('#go').onclick = () => { step = 1; sub = 0; window.scrollTo(0, 0); render(); };
  }
}

/** Un bloque normal es una sola pantalla. El Bloque C se reparte en varias:
    la pregunta de caminata, luego una situacion por pantalla, y la de certeza. */
function pantallas(b) {
  const qs = b.questions.filter(visible);
  if (!qs.some(z => z.type === 'choice')) return [qs];
  const out = []; let buf = [];
  for (const z of qs) {
    if (z.type === 'choice') { if (buf.length) { out.push(buf); buf = []; } out.push([z]); }
    else buf.push(z);
  }
  if (buf.length) out.push(buf);
  return out;
}

function renderBlock(b) {
  const n = SURVEY.blocks.length;
  const pg = pantallas(b);
  if (sub >= pg.length) sub = pg.length - 1;
  const qs = pg[sub];
  const esC = qs.length === 1 && qs[0].type === 'choice';

  $('#bar').style.width = ((step - 1 + (sub + 1) / pg.length) / n * 100) + '%';
  let h = `<p class="step">${esc(t('step', {a: step, b: n}))}</p>
           <h2>${esc(b.title[lang])}</h2>`;
  // la explicacion del experimento va justo antes de la primera situacion,
  // no antes de la pregunta de caminata que la precede
  if (esC && qs[0].card === 1) h += `<p class="intro">${esc(introC())}</p>
                                     <p class="intro">${esc(SURVEY.bloqueC.introComun[lang])}</p>`;
  if (esC) h += `<p class="situ">${esc(SURVEY.bloqueC.situacion[lang]
                     .replace('{n}', qs[0].card))}</p>`;
  // en un bloque paginado no se numeran las preguntas: el numero se reiniciaria
  // en cada pantalla y confundiria mas que orientar
  const paginado = pg.length > 1;
  qs.forEach((z, i) => { h += field(z, paginado ? 0 : i + 1); });
  const ultima = step === n && sub === pg.length - 1;
  h += `<div class="nav">
          ${(step > 1 || sub > 0) ? `<button id="prev">${esc(t('back'))}</button>` : '<span></span>'}
          <button id="nx" class="primary">${ultima ? esc(t('submit')) : esc(t('next'))}</button>
        </div>`;
  $('#main').innerHTML = h;
  wire(qs);
}

function field(q, i) {
  const id = q.id;
  const lbl = `<div class="q" id="w_${id}">
     <p class="qt">${i ? `<span class="num">${i}</span>` : ''}${esc(q.text[lang])}</p>
     ${q.hint ? `<p class="hint">${esc(q.hint[lang])}</p>` : ''}
     <p class="err" id="e_${id}"></p>`;
  let body = '';
  const opts = optionsOf(q);

  if (q.type === 'choice') {
    const c = tarjeta(q.card), BC = SURVEY.bloqueC, mn = esc(BC.min[lang]);
    // El tiempo a bordo se pivota sobre B10_Duracion y se acota a [8..60] minutos:
    // sin la acotacion el diseno genera trayectos imposibles en una isla de 40 km.
    const tmin = p => Math.min(BC.clamp[1], Math.max(BC.clamp[0],
                                Math.round(baseC() * p.ratio)));
    // «cada hora» / «cada 2 horas» se leen mejor que «cada 60 / 120 min»
    const cada = p => esc(BC.frecLabel && BC.frecLabel[p.frec] ? BC.frecLabel[p.frec][lang]
                                                             : BC.cada[lang].replace('{n}', p.frec));
    const nada = esc(BC.nada[lang]);
    // en el escenario B la persona no declaro un viaje: no hay «tiempo actual» que mostrar
    const hoyT = escenarioC() === 'ESC_A'
               ? esc(BC.hoyTiempo[lang].replace('{n}', BC.b10Corto[A.B10_Duracion])) : nada;
    const fila = (k, a, b, hoy) =>
      '<tr><th>' + esc(BC.labels[k][lang]) + '</th><td>' + a + '</td><td>' + b +
      '</td><td class="hoy">' + hoy + '</td></tr>';
    body = '<div class="cardwrap"><table class="card3">' +
      '<tr><th></th><th class="alt">' + esc(q.options[0].label[lang]) + '</th>' +
      '<th class="alt">' + esc(q.options[1].label[lang]) + '</th>' +
      '<th class="alt hoy">' + esc(BC.colHoy[lang]) + '</th></tr>' +
      fila('tarifa',     '<b>$' + c.A.tarifa.toFixed(2) + '</b>',
                         '<b>$' + c.B.tarifa.toFixed(2) + '</b>', nada) +
      fila('tiempo',     '<b>' + tmin(c.A) + '</b> ' + mn,
                         '<b>' + tmin(c.B) + '</b> ' + mn, hoyT) +
      fila('caminata',   '<b>' + c.A.caminata + '</b> ' + mn,
                         '<b>' + c.B.caminata + '</b> ' + mn, nada) +
      fila('frec',       cada(c.A), cada(c.B), nada) +
      fila('transbordo', esc(BC.transbordo['' + c.A.transbordo][lang]),
                         esc(BC.transbordo['' + c.B.transbordo][lang]), nada) +
      fila('horario',    esc(BC.horario['' + c.A.noche][lang]),
                         esc(BC.horario['' + c.B.noche][lang]), nada) +
      '</table></div><div class="opts">' + opts.map(o =>
        `<label class="opt${A[id] === o.code ? ' sel' : ''}">
           <input type="radio" name="${id}" value="${esc(o.code)}"${A[id] === o.code ? ' checked' : ''}>
           <span>${esc(o.label[lang])}</span></label>`).join('') + '</div>';
  } else if (q.type === 'radio') {
    const cur = A[id] !== undefined ? A[id] : (q.default ? A[q.default] : undefined);
    body = `<div class="opts">` + opts.map(o =>
      `<label class="opt${cur === o.code ? ' sel' : ''}">
         <input type="radio" name="${id}" value="${esc(o.code)}"${cur === o.code ? ' checked' : ''}>
         <span>${esc(o.label[lang])}</span></label>`).join('') + `</div>`;
  } else if (q.type === 'cascade') {
    body = `<div class="opts">` + opts.map(o =>
      `<label class="opt${A[id] === o.code ? ' sel' : ''}">
         <input type="radio" name="${id}" value="${esc(o.code)}"${A[id] === o.code ? ' checked' : ''}>
         <span>${esc(o.label[lang])}</span></label>`).join('') + `</div>`;
  } else if (q.type === 'check') {
    const cur = A[id] || [];
    body = `<div class="opts">` + opts.map(o =>
      `<label class="opt${cur.includes(o.code) ? ' sel' : ''}">
         <input type="checkbox" name="${id}" value="${esc(o.code)}"${cur.includes(o.code) ? ' checked' : ''}>
         <span>${esc(o.label[lang])}</span></label>`).join('') + `</div>`;
  } else if (q.type === 'number') {
    const unit = id === 'B10_Duracion' ? ` <span class="unit">${esc(t('minutes'))}</span>` : '';
    body = `<p><input class="num-in" type="number" inputmode="numeric" name="${id}"
              min="${q.min}" max="${q.max}" value="${A[id] !== undefined ? esc(A[id]) : ''}">${unit}
            <span class="unit">(${q.min}–${q.max})</span></p>`;
  } else if (q.type === 'text') {
    body = `<p><input class="txt" type="text" name="${id}" maxlength="${q.maxlen}"
              value="${A[id] ? esc(A[id]) : ''}"></p>`;
  } else if (q.type === 'textarea') {
    body = `<p><textarea class="txt" name="${id}" rows="4" maxlength="${q.maxlen}">${A[id] ? esc(A[id]) : ''}</textarea></p>`;
  } else if (q.type === 'matrix') {
    body = q.rows.map((r, ri) => {
      const key = id + '_' + ri;
      return `<div class="mrow"><p class="mlab">${esc(r[lang])}</p><div class="opts">` +
        opts.map(o => `<label class="opt${A[key] === o.code ? ' sel' : ''}">
          <input type="radio" name="${key}" value="${esc(o.code)}"${A[key] === o.code ? ' checked' : ''}>
          <span>${esc(o.label[lang])}</span></label>`).join('') + `</div></div>`;
    }).join('');
  }
  // v1.4: si la pregunta tiene una opción «Otro», debajo va su casilla de texto
  if (q.otherCode && otroActivo(q)) {
    const v = A[id + '_Otro'] || '';
    body += `<p class="otro-wrap"><input class="txt otro" type="text" name="${id}_Otro"
               maxlength="60" placeholder="${esc(t('specify'))}" value="${esc(v)}"></p>`;
  }
  return lbl + body + `</div>`;
}

/* ---------- eventos ---------- */
function wire(qs) {
  $('#main').querySelectorAll('input,textarea').forEach(el => {
    el.addEventListener('change', () => {
      const nm = el.name;
      if (el.type === 'checkbox') {
        const q = allQuestions().find(x => x.id === nm);
        let cur = A[nm] || [];
        if (el.checked) {
          if (q.exclusive && el.value === q.exclusive) cur = [el.value];
          else { cur = cur.filter(v => v !== q.exclusive); cur.push(el.value); }
        } else cur = cur.filter(v => v !== el.value);
        if (q.maxSelect && cur.length > q.maxSelect) {
          el.checked = false;
          return flash(nm, t('maxSel', {n: q.maxSelect}));
        }
        A[nm] = cur;
        // con una opción excluyente, la pantalla tiene que reflejar lo que quedó guardado
        if (q.exclusive) el.closest('.opts').querySelectorAll('input').forEach(i => { i.checked = cur.includes(i.value); });
      } else A[nm] = el.value;
      save();
      if (nm.endsWith('_Otro')) return;   // teclear en la casilla no debe redibujar
      // se redibuja cuando cambia algo de lo que dependen otras preguntas,
      // y también cuando la pregunta tiene opción «Otro» (para abrir o cerrar su casilla)
      // se deriva de las condiciones del propio instrumento: una pregunta nueva con
      // condicion ya no puede quedarse sin redibujo (le paso a B3 en la v1.5)
      const dep = ['B2_Motivo','B5b_DestinoEspecifico','A9_Idiomas','B1_ViajaFuera',
                   ...allQuestions().filter(x => x.cond).map(x => x.cond.q)];
      const conOtro = allQuestions().some(x => x.id === nm && x.otherCode);
      if (dep.includes(nm) || conOtro) {
        const y = window.scrollY; render(); window.scrollTo(0, y);
      } else {
        el.closest('.opts')?.querySelectorAll('.opt').forEach(o =>
          o.classList.toggle('sel', o.querySelector('input').checked));
      }
    });
  });
  $('#prev') && ($('#prev').onclick = () => {
    if (sub > 0) sub--;
    else { step--; sub = Math.max(0, pantallas(SURVEY.blocks[step - 1]).length - 1); }
    window.scrollTo(0, 0); render();
  });
  $('#nx').onclick = () => {
    if (!validate(qs)) return;
    if (A.Consent === 'No')       return end(t('outConsent'));
    if (A.Residencia === 'No')    return end(t('outResid'));
    if (A.Edad === 'E00') return end(t('outEdad'));
    const pg = pantallas(SURVEY.blocks[step - 1]);
    if (sub < pg.length - 1) { sub++; window.scrollTo(0, 0); return render(); }
    if (step === SURVEY.blocks.length) return submit();
    step++; sub = 0; window.scrollTo(0, 0); render();
  };
}

function flash(id, msg) {
  const e = $('#e_' + id) || $('#e_' + id.split('_').slice(0, -1).join('_'));
  if (!e) return alert(msg);
  e.textContent = msg; e.style.display = 'block';
  e.closest('.q').scrollIntoView({behavior: 'smooth', block: 'center'});
}

function validate(qs) {
  $('#main').querySelectorAll('.err').forEach(e => { e.textContent = ''; e.style.display = 'none'; });
  for (const q of qs) {
    const v = A[q.id];
    if (q.type === 'matrix') {
      for (let ri = 0; ri < q.rows.length; ri++)
        if (!A[q.id + '_' + ri]) { flash(q.id, t('required')); return false; }
      continue;
    }
    if (q.type === 'number' && v !== undefined && v !== '') {
      const n = Number(v);
      if (!Number.isInteger(n) || n < q.min || n > q.max) {
        flash(q.id, t('range', {a: q.min, b: q.max})); return false;
      }
    }
    if (q.required && (v === undefined || v === '' || (Array.isArray(v) && !v.length))) {
      flash(q.id, t('required')); return false;
    }
    // la casilla de texto de «Otro» es obligatoria en cuanto se marca esa opción
    if (q.otherCode && otroActivo(q) && !String(A[q.id + '_Otro'] || '').trim()) {
      flash(q.id, t('specifyReq')); return false;
    }
    // B5c es obligatoria cuando en B5b se eligió «Otro»; opcional en los demás casos
    if (q.id === 'B5c_DestinoNombre' && b5bEsOtro() && !String(v || '').trim()) {
      flash(q.id, t('specifyReq')); return false;
    }
    if (q.lte && A[q.lte] !== undefined && Number(v) > Number(A[q.lte])) {
      flash(q.id, t('errA3')); return false;
    }
    // CONTROL DURO del master: el destino no puede ser el barrio de origen. El origen es
    // A1_Barrio salvo que B3_OrigenEsBarrio = No, en cuyo caso es B3b_Origen. Los «Otro»
    // (codigo 99) no se comparan: dos textos libres distintos comparten ese codigo.
    // B12: el destino de tiempo libre tiene que estar FUERA de su barrio de residencia
    if (q.neq === 'RESIDENCIA' && v && !/99$/.test(v) && v === A.A1_Barrio) {
      flash(q.id, t('errResid')); return false;
    }
    if (q.neq === 'ORIGEN' && v && !/99$/.test(v)) {
      const origen = A.B3_OrigenEsBarrio === 'No' ? A.B3b_Origen : A.A1_Barrio;
      if (v === origen) { flash(q.id, t('errB4')); return false; }
    }
  }
  return true;
}

/* ---------- envío: cola persistente con reintento ---------- */
const QK = 'mobbon_queue';
const queue = () => { try { return JSON.parse(localStorage.getItem(QK) || '[]'); } catch (e) { return []; } };
const setQueue = q => { try { localStorage.setItem(QK, JSON.stringify(q)); } catch (e) {} };

/** Intenta vaciar la cola. Devuelve cuántos quedan pendientes. */
async function flush() {
  if (!ENDPOINT) return queue().length;
  let q = queue();
  while (q.length) {
    try {
      await fetch(ENDPOINT, {
        method: 'POST', mode: 'no-cors', keepalive: true,
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(q[0])
      });
    } catch (e) {
      break;                       // sin conexión: se queda en la cola para el próximo intento
    }
    q.shift(); setQueue(q); q = queue();
  }
  return q.length;
}

/** Elimina respuestas de preguntas que han dejado de mostrarse, y casillas
    «Otro» cuya opción ya no está marcada. Sin esto se envían datos fantasma:
    quien elige Trabajo → «Otro lugar» y luego cambia a Familia arrastraría el L99. */
function limpiarOcultas() {
  for (const q of allQuestions()) {
    if (!visible(q)) {
      delete A[q.id];
      delete A[q.id + '_Otro'];
      if (q.type === 'matrix') q.rows.forEach((_, ri) => delete A[q.id + '_' + ri]);
    } else if (q.otherCode && !otroActivo(q)) {
      delete A[q.id + '_Otro'];
    }
  }
  save();
}

async function submit() {
  limpiarOcultas();
  // variables derivadas del Bloque C, con los nombres del master
  if (A.C_Bloque) {
    A.C0_EscenarioTipo = escenarioC();   // ESC_A / ESC_B
    A.C_TiempoBase = baseC();            // minutos sobre los que se pivoto el tiempo a bordo
  }
  const btn = $('#nx'); btn.disabled = true; btn.textContent = t('sending');
  const payload = {
    instrumento: 'MOB-BON-2026 v1.5',
    idioma: lang,
    enviado: new Date().toISOString(),
    canal: new URLSearchParams(location.search).get('canal') || 'CH99',
    respuestas: A
  };
  const q = queue(); q.push(payload); setQueue(q);

  if (!ENDPOINT) {                 // sin destino configurado: descarga local (solo para pruebas)
    const b = new Blob([JSON.stringify(payload, null, 1)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'MOBBON26_' + Date.now() + '.json';
    a.click();
    setQueue([]);
    return done();
  }
  const pend = await flush();
  if (pend === 0) return done();
  btn.disabled = false; btn.textContent = t('submit');
  flash(SURVEY.blocks[step - 1].questions[0].id, t('sendErr'));
}

function done() {
  try { localStorage.setItem('mobbon_contacto', A.F2_ConsentContacto === 'Si' ? '1' : '0'); } catch (e) {}
  const fin = SURVEY.blocks.length + 1;
  olvidar(); step = fin; window.scrollTo(0, 0); render();
}

function renderThanks() {
  $('#bar').style.width = '100%';
  let h = `<h2>${esc(SURVEY.closing.f1[0][lang])}</h2>
           <p class="intro">${esc(SURVEY.closing.f6[lang])}</p>`;
  if (localStorage.getItem('mobbon_contacto') === '1') {
    // Los datos de contacto se piden AQUI MISMO, sin cambiar de pantalla,
    // pero se envian en una peticion aparte a otro destino (ver enviarContacto).
    h += `<div class="q" id="cbox" style="margin-top:24px">
       <p class="qt">${esc(t('cTitle'))}</p>
       <p class="hint">${esc(t('cIntro'))}</p>
       <p class="err" id="cerr"></p>
       <p><label class="flab">${esc(t('nameL'))}</label>
          <input class="txt" id="c_n" type="text" maxlength="40" autocomplete="name"></p>
       <p><label class="flab">${esc(t('emailL'))}</label>
          <input class="txt" id="c_e" type="email" maxlength="60" autocomplete="email"></p>
       <p><label class="flab">${esc(t('telL'))}</label>
          <input class="txt" id="c_p" type="tel" maxlength="15" autocomplete="tel"></p>
       <p style="margin-top:16px">
          <button id="csend" class="primary nav-btn">${esc(t('cSend'))}</button></p>
       <p class="sep-note">${esc(t('cSep'))}</p>
     </div>`;
  }
  $('#main').innerHTML = h;
  const b = $('#csend');
  if (b) b.onclick = enviarContacto;
}

/** Envio INDEPENDIENTE: otra peticion, otro destino, sin nada que lo ate a las respuestas. */
async function enviarContacto() {
  const n = $('#c_n').value.trim(), e = $('#c_e').value.trim(), p = $('#c_p').value.trim();
  const err = $('#cerr');
  err.style.display = 'none';
  if (!e && !p) { err.textContent = t('cNeed'); err.style.display = 'block'; return; }
  const b = $('#csend'); b.disabled = true; b.textContent = t('sending');
  const payload = {tipo: 'contacto', idioma: lang, nombre: n, email: e, telefono: p};
  try {
    if (ENDPOINT) {
      await fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', keepalive: true,
        headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
    }
    localStorage.removeItem('mobbon_contacto');
    $('#cbox').innerHTML = `<p class="qt">${esc(t('cDone'))}</p>`;
  } catch (x) {
    b.disabled = false; b.textContent = t('cSend');
    err.textContent = t('sendErr'); err.style.display = 'block';
  }
}

function end(msg) { olvidar(); ended = msg; window.scrollTo(0, 0); render(); }
function renderEnd() {
  $('#bar').style.width = '100%';
  $('#main').innerHTML = `<h2>${esc(ended)}</h2>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('.lang');
  if (!b) return;
  lang = b.dataset.l; localStorage.setItem('mobbon_lang', lang);
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
render();

/* ---------- salvaguardas para quien publica el formulario ---------- */
(function admin() {
  if (!ENDPOINT) {
    const d = document.createElement('div');
    d.id = 'warn';
    d.innerHTML = '<b>CONFIGURACION INCOMPLETA.</b> La linea ENDPOINT de este archivo esta vacia: ' +
      'las respuestas NO se envian a ninguna parte, solo se descargan en el dispositivo de quien ' +
      'responde. Pegue la URL de su Google Apps Script antes de publicar este formulario.';
    document.body.prepend(d);
  }
  flush().then(n => {
    if (n > 0 && ENDPOINT) {
      const d = document.createElement('div');
      d.id = 'pend';
      d.textContent = n + ' respuesta(s) pendiente(s) de enviar. Se reintentara automaticamente.';
      document.body.prepend(d);
    }
  });
  if (location.hash === '#estado') {
    alert('Version publicada: MOB-BON-2026 v1.5' +
          '\nDestino configurado: ' + (ENDPOINT ? 'SI' : 'NO') +
          '\nRespuestas en cola: ' + queue().length);
  }
})();

</script>
